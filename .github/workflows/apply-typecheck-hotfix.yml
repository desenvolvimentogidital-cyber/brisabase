name: Apply TypeScript hotfix

on:
  push:
    branches:
      - hotfix/typecheck-1.0.1
    paths:
      - .github/typecheck-hotfix.patch

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/typecheck-1.0.1
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/typecheck-hotfix.patch
          git apply .github/typecheck-hotfix.patch
          rm .github/typecheck-hotfix.patch
          rm .github/workflows/apply-typecheck-hotfix.yml
          git config user.name "BrisaBase CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve TypeScript runner errors"
          git push origin HEAD:hotfix/typecheck-1.0.1
