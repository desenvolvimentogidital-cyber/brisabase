name: BrisaBase Windows Final Certification

on:
  push:
    branches:
      - fix/final-release-gates

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Phase 8 verification chain
        run: npm run phase8:verify

      - name: CI security, tests and build
        run: npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser regression gate
        run: npm run test:browser

  certify-windows:
    needs: preflight
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout latest certification branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-release-gates
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Runner diagnostics
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          node --version
          npm --version
          git --version
          docker --version

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Phase 8 verification chain
        run: npm run phase8:verify

      - name: CI security, tests and build
        run: npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser regression gate
        run: npm run test:browser

      - name: Docker availability
        shell: pwsh
        run: |
          docker version
          docker info

      - name: Docker release certification
        run: npm run release:validate:docker
