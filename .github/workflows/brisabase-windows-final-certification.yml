name: BrisaBase Windows Final Certification

on:
  push:
    branches:
      - fix/final-release-gates

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize audited certification corrections
        run: node scripts/final-release-fixes-v2.cjs

      - name: Persist audited certification corrections
        shell: bash
        run: |
          audited_paths=(
            server/config.ts
            server/billing/localBillingEngine.ts
            server/tests/production-config-contract.test.ts
            server/tests/admin-ui-api-mode-contract.test.ts
            server/tests/billing-enterprise-iac-phase8-contract.test.cjs
            server/tests/docker.integration.test.ts
            src/index.css
          )
          if [[ -n "$(git status --porcelain -- "${audited_paths[@]}")" ]]; then
            git config user.name "BrisaBase Release Bot"
            git config user.email "noreply@brisabase.local"
            git add -- "${audited_paths[@]}"
            git commit -m "fix: persist audited final certification corrections"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Audited certification corrections are already synchronized."
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Build SDK verification artifact
        run: npm run build:sdk

      - name: Phase 8 verification chain
        run: npm run phase8:verify

      - name: CI security, tests and build
        run: npm run test:ci

  certify-windows:
    needs: preflight
    runs-on: self-hosted
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout latest certification branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-release-gates
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Runner diagnostics
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          node --version
          npm --version
          git --version
          docker --version
          docker compose version

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Build SDK verification artifact
        run: npm run build:sdk

      - name: Phase 8 verification chain
        run: npm run phase8:verify

      - name: CI security, tests and build
        run: npm run test:ci

      - name: Docker availability
        run: |
          docker version
          docker info

      - name: Docker, real integration and browser release certification
        run: npm run release:validate:docker
