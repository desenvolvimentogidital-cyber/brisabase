name: Responsive Release Gate Repair

on:
  push:
    branches:
      - fix/final-responsive-release-gate

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-responsive-release-gate
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fix responsive containment and overflow diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('e2e/admin-ui-smoke.spec.ts')
          source = test_path.read_text()
          start = source.index('    const offenders = Array.from(document.querySelectorAll<HTMLElement>(\'*\'))')
          end = source.index('\n\n    return {', start)
          replacement = '''    const isInsideLocalHorizontalScroller = (element: HTMLElement): boolean => {
      let parent = element.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        const style = window.getComputedStyle(parent);
        if (style.overflowX === 'auto' || style.overflowX === 'scroll') {
          const rect = parent.getBoundingClientRect();
          if (rect.left >= -1 && rect.right <= viewportWidth + 1 && rect.width <= viewportWidth + 1) return true;
        }
        parent = parent.parentElement;
      }
      return false;
    };

    const offenders = Array.from(document.querySelectorAll<HTMLElement>('*'))
      .filter((element) => {
        const style = window.getComputedStyle(element);
        if (style.display === 'none' || style.visibility === 'hidden') return false;
        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return false;
        const outsideViewport = rect.left < -1 || rect.right > viewportWidth + 1 || rect.width > viewportWidth + 1;
        if (!outsideViewport) return false;
        // Content inside a bounded horizontal scroller is intentionally reachable
        // by the user and must not be confused with document-level overflow.
        return !isInsideLocalHorizontalScroller(element);
      })
      .slice(0, 8)
      .map((element) => {
        const rect = element.getBoundingClientRect();
        return {
          tag: element.tagName.toLowerCase(),
          id: element.id,
          className: typeof element.className === 'string' ? element.className : '',
          left: Math.round(rect.left),
          right: Math.round(rect.right),
          width: Math.round(rect.width),
        };
      });'''
          test_path.write_text(source[:start] + replacement + source[end:])

          docs_path = Path('src/brisabase/pages/DocumentationPage.tsx')
          docs = docs_path.read_text()
          replacements = {
            '<div className="space-y-6 pb-12">': '<div className="min-w-0 max-w-full space-y-6 pb-12">',
            '<div className="grid gap-6 lg:grid-cols-[250px_minmax(0,1fr)]">': '<div className="grid min-w-0 max-w-full grid-cols-[minmax(0,1fr)] gap-6 lg:grid-cols-[250px_minmax(0,1fr)]">',
            '<aside className="h-fit rounded-2xl border border-white/[0.08] bg-slate-900/50 p-3 lg:sticky lg:top-6">': '<aside className="min-w-0 max-w-full h-fit rounded-2xl border border-white/[0.08] bg-slate-900/50 p-3 lg:sticky lg:top-6">',
            '<article className="space-y-6 rounded-2xl border border-white/[0.08] bg-slate-900/40 p-5 md:p-7">': '<article className="min-w-0 max-w-full space-y-6 rounded-2xl border border-white/[0.08] bg-slate-900/40 p-5 md:p-7">',
          }
          for old, new in replacements.items():
            if docs.count(old) != 1:
              raise SystemExit(f'Expected exactly one Documentation layout target: {old}')
            docs = docs.replace(old, new)
          docs_path.write_text(docs)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/responsive-release-gate-repair.yml

      - name: Validate responsive repair
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Refresh and verify source integrity manifest
        run: |
          node scripts/release-source-manifest.cjs generate
          npm run release:manifest:verify

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: contain responsive docs and bounded scroll regions"
          git push origin HEAD:fix/final-responsive-release-gate
