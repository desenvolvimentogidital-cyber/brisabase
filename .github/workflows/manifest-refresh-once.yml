name: Refresh Responsive Repair Manifest

on:
  push:
    branches:
      - fix/final-responsive-release-gate

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/final-responsive-release-gate
          fetch-depth: 0

      - name: Remove one-shot workflow
        run: rm .github/workflows/manifest-refresh-once.yml

      - name: Refresh source manifest
        run: node scripts/release-source-manifest.cjs generate

      - name: Verify source manifest
        run: npm run release:manifest:verify

      - name: Commit manifest refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh responsive repair source manifest"
          git push origin HEAD:fix/final-responsive-release-gate
