name: Internal Manifest Refresh

on:
  push:
    branches: [fix/internal-release-readiness]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/internal-release-readiness
          fetch-depth: 0

      - name: Remove one-shot workflow before hashing
        run: rm .github/workflows/internal-manifest-refresh.yml

      - name: Generate canonical source manifest
        run: node scripts/release-source-manifest.cjs generate

      - name: Commit manifest and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh source integrity manifest"
          git push origin HEAD:fix/internal-release-readiness
