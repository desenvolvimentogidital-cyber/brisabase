name: Paddle Beta Migration

on:
  push:
    branches:
      - feat/paddle-billing-disabled-beta
    paths:
      - .github/workflows/paddle-beta-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/paddle-billing-disabled-beta
          fetch-depth: 0

      - name: Apply provider migration
        run: node scripts/migrate-paddle-beta.cjs

      - name: Remove one-shot helpers and regenerate manifest
        run: |
          rm .github/workflows/paddle-beta-migration.yml
          rm scripts/migrate-paddle-beta.cjs
          npm run release:manifest:generate

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish Paddle-ready free public beta"
          git push origin HEAD:feat/paddle-billing-disabled-beta
