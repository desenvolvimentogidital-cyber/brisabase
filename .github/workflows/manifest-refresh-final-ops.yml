name: Refresh Final Operations Manifest

on:
  push:
    branches:
      - chore/public-beta-operations-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/public-beta-operations-final
          fetch-depth: 0

      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Remove one-shot workflow and refresh manifest
        run: |
          rm .github/workflows/manifest-refresh-final-ops.yml
          node scripts/release-source-manifest.cjs generate
          node scripts/release-source-manifest.cjs verify

      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh final operations source manifest"
          git push origin HEAD:chore/public-beta-operations-final
