name: Apply Realtime test fix

on:
  push:
    branches:
      - hotfix/typecheck-1.0.1
    paths:
      - .github/realtime-test-fix.patch

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/typecheck-1.0.1
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/realtime-test-fix.patch
          git apply .github/realtime-test-fix.patch
          rm .github/realtime-test-fix.patch
          rm .github/workflows/apply-realtime-test-fix.yml
          git config user.name "BrisaBase CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate realtime webhook fanout failures"
          git push origin HEAD:hotfix/typecheck-1.0.1
