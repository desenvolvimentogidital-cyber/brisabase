name: Billing Hot Path Repair

on:
  push:
    branches: [fix/billing-meter-hot-path]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/billing-meter-hot-path
          fetch-depth: 0
      - name: Configure Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Remove repeated plan writes from request hot path
        env:
          OLD_ENSURE: 
          NEW_ENSURE: 
          OLD_METER: 
          NEW_METER: 
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('server/billing/localBillingEngine.ts','utf8');
          const decode=(value)=>Buffer.from(value,'base64').toString('utf8');
          const oldEnsure=decode(process.env.OLD_ENSURE); const newEnsure=decode(process.env.NEW_ENSURE);
          const oldMeter=decode(process.env.OLD_METER); const newMeter=decode(process.env.NEW_METER);
          if(source.split(oldEnsure).length-1!==1) throw new Error('ensurePlans source block did not match exactly once');
          if(source.split(oldMeter).length-1!==1) throw new Error('meterApiRequest source block did not match exactly once');
          fs.writeFileSync('server/billing/localBillingEngine.ts',source.replace(oldEnsure,newEnsure).replace(oldMeter,newMeter));
          NODE
      - name: Remove one-shot workflow before validation
        run: rm .github/workflows/billing-hot-path-repair.yml
      - name: Validate optimized source
        run: |
          npm run phase8:verify
          npm run typecheck
          npm test
      - name: Refresh source integrity manifest
        run: node scripts/release-source-manifest.cjs generate
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove billing plan writes from API hot path"
          git push origin HEAD:fix/billing-meter-hot-path
