name: Apply Functions Compose contract fix

on:
  push:
    branches:
      - hotfix/typecheck-1.0.1
    paths:
      - .github/functions-compose-contract-fix.patch

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/typecheck-1.0.1
          fetch-depth: 0
      - name: Apply contract update
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/functions-compose-contract-fix.patch
          git apply .github/functions-compose-contract-fix.patch
          rm .github/functions-compose-contract-fix.patch
          rm .github/workflows/apply-functions-compose-contract-fix.yml
          git config user.name "BrisaBase CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: include Functions executor in production contract"
          git push origin HEAD:hotfix/typecheck-1.0.1
