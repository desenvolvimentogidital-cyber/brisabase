name: Apply custom-domain default fix

on:
  push:
    branches:
      - hotfix/typecheck-1.0.1
    paths:
      - .github/custom-domain-default-fix.patch

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/typecheck-1.0.1
          fetch-depth: 0
      - name: Apply runtime configuration fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/custom-domain-default-fix.patch
          git apply .github/custom-domain-default-fix.patch
          rm .github/custom-domain-default-fix.patch
          rm .github/workflows/apply-custom-domain-default-fix.yml
          git config user.name "BrisaBase CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: require explicit custom-domain enablement"
          git push origin HEAD:hotfix/typecheck-1.0.1
